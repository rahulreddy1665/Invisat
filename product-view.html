      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .search-box {
      width: 90%;
      margin: 20px auto;
      text-align: right;
    }

    .search-box input {
      padding: 8px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
      cursor: pointer;
    }

    th.sortable:hover {
      background-color: #f1f1f1;
    }

    .not-found {
      text-align: center;
      color: red;
      margin-top: 50px;
    }

    th.sortable {
      position: relative;
      padding-right: 20px;
    }

    th.sortable::after {
      content: "\2195";
      /* up/down arrow */
      position: absolute;
      right: 8px;
      font-size: 12px;
      color: #888;
    }

    th.sortable.asc::after {
      content: "\2191";
      /* up arrow */
    }

    th.sortable.desc::after {
      content: "\2193";
      /* down arrow */
    }
  </style>
</head>

    // Display the correct table
    const container = document.getElementById('table-container');
    if (productTables[productName]) {
      container.innerHTML = productTables[productName];
    } else {
      container.innerHTML = `<div class="not-found">No table found for <strong>${productName}</strong>.</div>`;
    }

    // Search Functionality
    document.getElementById('searchInput').addEventListener('input', function () {
      const filter = this.value.toLowerCase();
      const rows = document.querySelectorAll('#productTable tbody tr');
      rows.forEach(row => {
        const match = Array.from(row.cells).some(cell =>
          cell.textContent.toLowerCase().includes(filter)
        );
        row.style.display = match ? '' : 'none';
      });
    });

    // Sort Functionality
    document.addEventListener('click', function (e) {
      if (e.target.classList.contains('sortable')) {
        const th = e.target;
        const table = th.closest('table');
        const tbody = table.querySelector('tbody');
        const index = Array.from(th.parentNode.children).indexOf(th);
        const rows = Array.from(tbody.querySelectorAll('tr'));

        // Determine sort direction
        const isAsc = !th.classList.contains('asc');
        table.querySelectorAll('th').forEach(header => header.classList.remove('asc', 'desc'));
        th.classList.toggle('asc', isAsc);
        th.classList.toggle('desc', !isAsc);

        // Sort rows
        rows.sort((a, b) => {
          const cellA = a.children[index].textContent.trim().toLowerCase();
          const cellB = b.children[index].textContent.trim().toLowerCase();
          if (cellA < cellB) return isAsc ? -1 : 1;
          if (cellA > cellB) return isAsc ? 1 : -1;
          return 0;
        });

        rows.forEach(row => tbody.appendChild(row));
      }
    });

  </script>
